name: Publish APK and OTA metadata

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'release/**'
      - '.github/workflows/release.yml'
      - 'scripts/publish-release.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-touchxbox-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate signed package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag="$(python3 -c 'import json; print("v" + json.load(open("release/latest.json"))["versionName"])')"
          fi
          python3 scripts/publish-release.py --tag "$tag"
